<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icono de Gestor SSH: ventana de terminal sobre fondo verde azulado. Fuente de icon.png e icon.ico (npm run icons). -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bb39a"/>
      <stop offset="1" stop-color="#11695e"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#fondo)"/>
  <!-- Ventana: marco blanco con barra superior y pantalla oscura. -->
  <rect x="96" y="120" width="320" height="272" rx="28" fill="#ffffff"/>
  <rect x="116" y="172" width="280" height="200" rx="12" fill="#17312d"/>
  <circle cx="132" cy="146" r="9" fill="#11695e"/>
  <circle cx="160" cy="146" r="9" fill="#11695e"/>
  <!-- Prompt «>_». -->
  <path d="M156 224 L210 262 L156 300" fill="none" stroke="#5fe0c6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M232 318 H312" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
</svg>
